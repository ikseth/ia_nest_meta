          <rect class="ext" x="130" y="95" width="150" height="110" rx="5"/><text class="b" x="205" y="124" text-anchor="middle">Recuerda</text><text class="sub" x="205" y="146" text-anchor="middle">memoria e hilo</text><text class="sub" x="205" y="164" text-anchor="middle">perfil del interlocutor</text><text class="sub" x="205" y="182" text-anchor="middle">identidad, delegadas</text>

          <rect class="core" x="325" y="40" width="150" height="76" rx="5"/><text class="b" x="400" y="72" text-anchor="middle">Confirmador</text><text class="sub" x="400" y="92" text-anchor="middle">con enrutador</text>
          <rect class="ext" x="520" y="40" width="150" height="76" rx="5"/><text class="b" x="595" y="72" text-anchor="middle">Busca</text><text class="sub" x="595" y="92" text-anchor="middle">conocimiento</text>
          <rect class="core" x="715" y="40" width="120" height="76" rx="5"/><text x="775" y="72" text-anchor="middle">Dominio</text><text class="sub" x="775" y="92" text-anchor="middle">genera</text>

          <rect class="core" x="325" y="200" width="150" height="76" rx="5"/><text class="b" x="400" y="232" text-anchor="middle">Orquestador</text><text class="sub" x="400" y="252" text-anchor="middle">planifica</text>
          <rect class="ext" x="520" y="200" width="150" height="76" rx="5"/><text class="b" x="595" y="232" text-anchor="middle">Busca</text><text class="sub" x="595" y="252" text-anchor="middle">por cada tarea</text>
          <rect class="core" x="715" y="200" width="120" height="76" rx="5"/><text x="775" y="232" text-anchor="middle">Dominios</text><text class="sub" x="775" y="252" text-anchor="middle">generan, combina</text>

          <rect class="ext" x="865" y="115" width="105" height="70" rx="5"/><text class="b" x="917" y="145" text-anchor="middle">Escribe</text><text class="sub" x="917" y="165" text-anchor="middle">memoria</text>

