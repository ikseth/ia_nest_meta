<svg xmlns="http://www.w3.org/2000/svg" width="980" height="320" viewBox="0 0 980 320" role="img" aria-label="Extended recupera memoria e hilo antes del confirmador, busca conocimiento antes de cada dominio o tarea y escribe la memoria al final. El core entiende, reparte y genera."><style>
text{font-family:Helvetica,Arial,sans-serif;fill:#1d2422;font-size:13px}
.sub{fill:#5a6661;font-size:11.5px}.b{font-weight:700}
.box{fill:#ffffff;stroke:#b5bdb8;stroke-width:1.2}
.core{fill:#dcefe6;stroke:#1f6f55;stroke-width:2}
.ext{fill:#f6e8cb;stroke:#8a5a0b;stroke-width:2}
.edge{stroke:#5a6661;stroke-width:1.4;fill:none}
.main{stroke:#1f6f55;stroke-width:2.4;fill:none}
.dash{stroke:#5a6661;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
.head{fill:#5a6661}.headm{fill:#1f6f55}
</style><rect width="980" height="320" fill="#ffffff"/>
